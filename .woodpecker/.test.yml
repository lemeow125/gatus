skip_clone: false

services:
  docker:
    image: docker:dind
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""

steps:
  - name: test-compose
    image: docker
    environment:
      DOCKER_HOST: tcp://docker:2375
      PORT: "9100"                  
    commands:
      - echo "PORT=${PORT}" >> .env
      - echo "Waiting for Docker daemon..."
      - until docker info >/dev/null 2>&1; do sleep 1; done
      - echo "Daemon ready."
      - echo "PORT=${PORT}" > .env
      - docker compose up -d
      - echo "Waiting for services to stabilise..."
      - sleep 15
      # Check that the service container is still running
      - echo "Checking if service is still up..."
      - docker compose ps gatus | grep -q "Up" || {
          echo "❌ Gatus container is not running!";
          docker compose logs;
          exit 1;
        }
      - echo "✅ Service is running. Configuration valid."
      - docker-compose down

when:
  event: [push, manual]